name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: node --test test/publication.mjs
      - run: node test/installation-mutations.mjs
      - name: Check Bash entry points
        if: runner.os == 'Linux'
        run: bash -n install.sh && bash -n start.sh && bash -n upgrade.sh
  console:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: prebuilt-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm exec --yes --package=pnpm@10.34.0 -- pnpm install --frozen-lockfile --prod=false
        working-directory: ui
      - run: npm exec --yes --package=pnpm@10.34.0 -- pnpm run build
        working-directory: ui
      - name: Package verified prebuilt console and committed source
        run: node scripts/package-release.mjs
      - name: Smoke test installation without build tools
        run: |
          ADMIN_TOKEN=ci-install-smoke-only node .runtime/release/package/scripts/install.mjs --no-start --port 19876 --lang en
          test ! -d .runtime/release/package/ui/node_modules
          test ! -e .runtime/release/package/data/accounts.json
      - name: Publish prebuilt release after all checks pass
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_EXISTING: ${{ contains(github.event.head_commit.message, '[rebuild-release]') && 'true' || 'false' }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'A stable semantic version is required.' >&2; exit 1; }
          tag="v$version"
          notes="docs/releases/$tag.md"
          test -f "$notes"
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$GITHUB_SHA" ]]; then
            echo 'A newer commit exists; this build will not replace the latest release.'
            exit 0
          fi
          if gh release view "$tag" --json isDraft > .runtime/release/existing.json 2>/dev/null; then
            if [[ "$(node -p "JSON.parse(require('fs').readFileSync('.runtime/release/existing.json')).isDraft")" != true && "$REBUILD_EXISTING" != true ]]; then
              gh release edit "$tag" --notes-file "$notes"
              echo "$tag release notes synced; published assets and tag unchanged. Bump package.json to publish a new package."
              exit 0
            fi
            if [[ "$REBUILD_EXISTING" == true ]]; then
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > .runtime/release/rebuild.json
              [[ "$(node -p "JSON.parse(require('fs').readFileSync('.runtime/release/rebuild.json')).immutable === true")" != true ]] || { echo 'Immutable releases cannot be rebuilt.' >&2; exit 1; }
            fi
            gh release upload "$tag" .runtime/release/kuku2api.tar.gz .runtime/release/kuku2api.zip --clobber
            gh release upload "$tag" .runtime/release/SHA256SUMS --clobber
            if [[ "$REBUILD_EXISTING" == true ]]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
              gh release edit "$tag" --target "$GITHUB_SHA" --notes-file "$notes"
            fi
          else
            gh release create "$tag" .runtime/release/kuku2api.tar.gz .runtime/release/kuku2api.zip .runtime/release/SHA256SUMS --draft --target "$GITHUB_SHA" --title "kuku2api $tag" --notes-file "$notes"
          fi
          gh release edit "$tag" --draft=false --latest
